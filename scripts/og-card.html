<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  background: linear-gradient(135deg, #0F172A 0%, #030712 100%);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: #F8FAFC;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 90px;
  position: relative;
}
.bar {
  position: absolute;
  left: 60px; top: 80px; bottom: 80px;
  width: 4px;
  background: #10B981;
  border-radius: 2px;
  opacity: 0.65;
}
.icon {
  width: 104px; height: 104px;
  border-radius: 22px;
  background: #0F172A;
  border: 1.5px solid rgba(16,185,129,0.55);
  display: flex; align-items: center; justify-content: center;
  position: relative;
  margin-bottom: 36px;
}
.icon-n {
  font-family: 'Courier New', monospace;
  font-size: 70px; font-weight: 900;
  color: #10B981;
  letter-spacing: -3px;
  line-height: 1;
}
.icon-dot {
  position: absolute;
  bottom: 18px; right: 15px;
  width: 14px; height: 14px;
  background: #10B981;
  border-radius: 50%;
}
h1 {
  font-size: 100px; font-weight: 900;
  line-height: 0.88;
  letter-spacing: -5px;
  margin-bottom: 22px;
}
.tagline {
  font-size: 26px; font-weight: 400;
  color: #94A3B8;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 52px;
}
.byline {
  font-family: 'Courier New', monospace;
  font-size: 14px;
  color: #475569;
  letter-spacing: 3.5px;
  text-transform: uppercase;
}
.grid {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 420px;
  opacity: 0.06;
}
.ring1 {
  position: absolute;
  right: 108px; top: 118px;
  width: 160px; height: 160px;
  border: 1.5px solid #10B981;
  border-radius: 50%;
  opacity: 0.18;
}
.ring2 {
  position: absolute;
  right: 138px; top: 148px;
  width: 100px; height: 100px;
  border: 1.5px solid #10B981;
  border-radius: 50%;
  opacity: 0.28;
}
.dot-center {
  position: absolute;
  right: 179px; top: 189px;
  width: 18px; height: 18px;
  background: #10B981;
  border-radius: 50%;
  opacity: 0.45;
}
</style>
</head>
<body>
  <div class="bar"></div>

  <div class="icon">
    <span class="icon-n">N</span>
    <div class="icon-dot"></div>
  </div>

  <h1>NoZar</h1>
  <div class="tagline">Trade Without Cash</div>
  <div class="byline">South Africa &nbsp;&bull;&nbsp; Barter Platform</div>

  <svg class="grid" viewBox="0 0 420 630" xmlns="http://www.w3.org/2000/svg">
    <line x1="105" y1="0" x2="105" y2="630" stroke="#10B981" stroke-width="1"/>
    <line x1="210" y1="0" x2="210" y2="630" stroke="#10B981" stroke-width="1"/>
    <line x1="315" y1="0" x2="315" y2="630" stroke="#10B981" stroke-width="1"/>
    <line x1="0" y1="90"  x2="420" y2="90"  stroke="#10B981" stroke-width="1"/>
    <line x1="0" y1="180" x2="420" y2="180" stroke="#10B981" stroke-width="1"/>
    <line x1="0" y1="270" x2="420" y2="270" stroke="#10B981" stroke-width="1"/>
    <line x1="0" y1="360" x2="420" y2="360" stroke="#10B981" stroke-width="1"/>
    <line x1="0" y1="450" x2="420" y2="450" stroke="#10B981" stroke-width="1"/>
    <line x1="0" y1="540" x2="420" y2="540" stroke="#10B981" stroke-width="1"/>
  </svg>

  <div class="ring1"></div>
  <div class="ring2"></div>
  <div class="dot-center"></div>
</body>
</html>
